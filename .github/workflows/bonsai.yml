name: Generate Git Bonsai

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: git-bonsai
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          output-path: dist/bonsai.svg
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add dist/
          git commit -m "Update git bonsai" || echo "No changes to commit"
          git push