<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffda" stop-opacity="0"/>
      <stop offset=".5" stop-color="#64ffda" stop-opacity=".55"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffda" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e6f1ff"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .spark { animation: slide 6s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-200px); } 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="3" width="1200" height="2" fill="url(#line)"/>
  <rect class="spark" x="0" y="2" width="200" height="4" rx="2" fill="url(#spark)"/>
</svg>
