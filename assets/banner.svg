<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Aniruddha Ghosh</title>
  <desc id="d">Cybersecurity Engineer and AI Practitioner. I engineer AI systems that think like attackers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a192f"/>
      <stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#64ffda" stop-opacity=".20"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6f1ff"/>
      <stop offset="1" stop-color="#64ffda"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64ffda" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace; }
    .sans { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
    .prompt { font-size: 20px; fill: #64ffda; opacity: .9; }
    .name { font-size: 66px; font-weight: 700; fill: url(#name); letter-spacing: -1px; }
    .role { font-size: 27px; fill: #a8b2d1; }
    .line { font-size: 21px; fill: #64ffda; opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    .cur { animation: blink 1s steps(1) infinite; }
    .edge { stroke: #64ffda; stroke-opacity: .22; stroke-width: 1.5; fill: none; }
    .node { fill: #64ffda; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      3%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .node, .cur { animation: none; }
      .l1 { opacity: 1; }
      .node { opacity: .8; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="17.5" fill="none" stroke="#64ffda" stroke-opacity=".18"/>

  <!-- threat graph motif -->
  <g>
    <path class="edge" d="M860 90 L960 150 L1060 80 M960 150 L930 250 L1050 235 L960 150 M1050 235 L1120 160 L1060 80 M860 90 L930 250"/>
    <circle class="node" cx="860"  cy="90"  r="7"  style="animation-delay:0s"/>
    <circle class="node" cx="960"  cy="150" r="11" style="animation-delay:.6s"/>
    <circle class="node" cx="1060" cy="80"  r="7"  style="animation-delay:1.2s"/>
    <circle class="node" cx="930"  cy="250" r="8"  style="animation-delay:1.8s"/>
    <circle class="node" cx="1050" cy="235" r="9"  style="animation-delay:2.4s"/>
    <circle class="node" cx="1120" cy="160" r="6"  style="animation-delay:.9s"/>
  </g>

  <text class="mono prompt" x="64" y="84">ghoshzsh@secops:~$ whoami</text>
  <text class="sans name" x="62" y="168">Aniruddha Ghosh</text>
  <text class="sans role" x="64" y="214">Cybersecurity Engineer × AI Practitioner</text>

  <text class="mono line l1" x="64" y="278">I engineer AI systems that think like attackers.<tspan class="cur">▍</tspan></text>
  <text class="mono line l2" x="64" y="278">UEBA · Detection Engineering · Splunk · Sigma<tspan class="cur">▍</tspan></text>
  <text class="mono line l3" x="64" y="278">LangGraph Agents · MCP · Autonomous SOC<tspan class="cur">▍</tspan></text>
</svg>
